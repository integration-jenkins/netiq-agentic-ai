explicitly_excluded:
- path_template: /api/db-console/verify
  method: POST
  reason: Arbitrary SQL verification hazard
- path_template: /api/db-console/execute
  method: POST
  reason: Arbitrary SQL execution hazard
- path_template: /api/data/import
  method: POST
  reason: Data mutation / import operation
- path_template: /api/data/importMW
  method: POST
  reason: Data mutation / MW import operation
- path_template: /api/data/importDelta
  method: POST
  reason: Data mutation / delta import operation
- path_template: /api/data/import/**
  method: ANY
  reason: Bulk ETL / import operations
- path_template: '**/export'
  method: ANY
  reason: Export endpoints excluded from read-only query layer
- path_template: /api/refresh
  method: GET
  reason: Dashboard cache / view refresh operation
- path_template: /api/data/refresh/{type}
  method: GET
  reason: Materialized-view refresh operation
- path_template: /api/nodes/mw-tr-link/trigger-scheduler
  method: POST
  reason: Scheduler job trigger mutation
- path_template: /api/frequency/sync
  method: POST
  reason: Frequency sync state change
- path_template: /api/v1/ai/cell-to-ru/train
  method: POST
  reason: Model training mutation
