# Registry of this service's own HTTP APIs (what the UI / Java gateway can call).
# NOT to be confused with:
#   configs/allowed_apis.yaml - Java NETIQ backend endpoints this service may call
#   configs/routing.yaml      - agent / intent routing inside the orchestrator
#
# To add an API: write the handler function, then add an entry here.
#   handler : "module.path:function_name"
#   status  : implemented | stub   (stubs show "[not implemented]" in /docs)
api_routes:
  - id: main_page
    method: GET
    path: /
    tag: ui
    summary: Main page
    description: Serves ui/web/index.html (the local UI). Shows a placeholder until the UI is built.
    status: implemented
    in_schema: false
    handler: src.api.routes.ui:main_page

  - id: health
    method: GET
    path: /health
    tag: health
    summary: Health check
    description: Liveness check. Returns service status and the active backend mode (MOCK or LIVE).
    status: implemented
    handler: src.api.routes.health:health

  - id: inference
    method: POST
    path: /v1/inference
    tag: inference
    summary: Local LLM inference endpoint
    description: Executes prompt completion using local Ollama model with speed and quality metrics. Model name is configurable.
    status: implemented
    handler: src.api.routes.inference:inference_endpoint

  - id: chat
    method: POST
    path: /v1/chat
    tag: chat
    summary: Ask a question
    description: Takes a user question (ChatRequest) and returns an answer with evidence (ChatResponse).
    status: stub
    handler: src.api.routes.chat:chat

  - id: reports_query
    method: POST
    path: /v1/reports/query
    tag: reports
    summary: Query a report
    description: Fetches one page of a NETIQ report (ReportQuery in, ReportPage out).
    status: stub
    handler: src.api.routes.reports:query_report

  - id: metadata_reports_list
    method: GET
    path: /v1/metadata/reports
    tag: metadata
    summary: List reports
    description: Lists the reports in the catalog (configs/reports/catalog.yaml).
    status: stub
    handler: src.api.routes.metadata:list_reports

  - id: metadata_report_get
    method: GET
    path: /v1/metadata/reports/{report_id}
    tag: metadata
    summary: Get report definition
    description: Returns one report's definition - columns, filters and API mapping.
    status: stub
    handler: src.api.routes.metadata:get_report

  - id: export
    method: POST
    path: /v1/export
    tag: export
    summary: Export a report
    description: Downloads report data as a file.
    status: stub
    handler: src.api.routes.export:export_report

  # Session management (task 1.6): each logged-in user's own chats. Needs the NETIQ login session.
  - id: conversations_list
    method: GET
    path: /v1/conversations
    tag: conversations
    summary: List my chats
    description: Lists the logged-in user's own chats, most recently used first.
    status: implemented
    handler: src.api.routes.conversations:list_conversations

  - id: conversations_create
    method: POST
    path: /v1/conversations
    tag: conversations
    summary: Start a new chat
    description: Creates a new chat for the logged-in user and returns its conversation_id.
    status: implemented
    handler: src.api.routes.conversations:create_conversation

  - id: conversations_get
    method: GET
    path: /v1/conversations/{conversation_id}
    tag: conversations
    summary: Open a chat
    description: Returns the messages and state (last report, filters) of one of the user's own chats.
    status: implemented
    handler: src.api.routes.conversations:get_conversation

  - id: conversations_message
    method: POST
    path: /v1/conversations/{conversation_id}/messages
    tag: conversations
    summary: Send a message in a chat
    description: Stores the question and answer in the chat; follow-up questions get the recent chat history.
    status: implemented
    handler: src.api.routes.conversations:send_message

  - id: chat_demo
    method: GET
    path: /chat-demo
    tag: ui
    summary: Chat demo page
    description: Serves ui/web/chat_demo.html - log in, open your chats, see when history is sent for follow-ups.
    status: implemented
    in_schema: false
    handler: src.api.routes.conversations:chat_demo_page
