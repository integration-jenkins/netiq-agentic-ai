limits:
  pagination:
    default_page_size: 50
    max_page_size: 500
    max_retrieval_pages: 10
    max_retrieval_records: 1000
  http:
    connect_timeout_seconds: 5.0
    read_timeout_seconds: 15.0
    max_retries: 2
    max_response_bytes: 5242880 # 5 MB
    backoff_factor: 0.5
  circle:
    enforce_circle_scope: true
    allow_cross_circle_without_override: false
