# SAMPLE report metadata. Replace with a real report; register it in configs/reports/catalog.yaml.
id: ran_site_kpi
name: RAN Site KPI (sample)
domain: ran
api:
  method: GET
  path: /api/sample/ran/site-kpi            # must also appear in configs/allowed_apis.yaml
  paged: true
  page_size: 1000
columns: [circle, site_id, technology, kpi_name, kpi_value]
filters:
  - { name: circle, type: string, required: false }
  - { name: date,   type: date,   required: false }
circle_scope: server_side     # never taken from user text
empty_result_message: "No Data Found!!"
